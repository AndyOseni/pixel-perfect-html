// Helper: upload payslip to storage
window.uploadPayslipToSupabase = async function(file){
  if(!file) return null
  try{
    const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_')
    const { error: uploadError } = await supabase.storage.from(BUCKET).upload(fileName, file, { upsert: true })
    if(uploadError) throw uploadError
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(fileName)
    console.log('Payslip uploaded:', data.publicUrl)
    return { publicUrl: data.publicUrl, fileName: file.name, fileType: file.type, fileSize: file.size }
  } catch(e){
    console.error('Payslip upload failed', e)
    alert('Payslip upload failed: ' + e.message + '\nMake sure you created the "payslips" bucket and made it public.')
    return null
  }
}

// Helper: push localStorage data to Supabase
async function syncToSupabase(key, value){
  try{
    const data = JSON.parse(value)
    if(!Array.isArray(data)) return
    if(data.length === 0) return
    
    if(key === 'nut_members' || key === 'nut_etiosa_members'){
      // Upsert members
      const rows = data.map(m => ({
        id: m.id,
        employer_number: m.employerNumber,
        name: m.name,
        school: m.school || null,
        phone: m.phone || null,
        email: m.email || null,
        monthly_savings: m.monthlySavings || 0,
        total_savings: m.totalSavings || 0,
        pin: m.pin || '1234',
        is_first_login: m.is_first_login ?? true,
        status: m.status || 'active',
        grade: m.grade || null,
        join_date: m.joinDate || new Date().toISOString(),
        payslip_name: m.payslipName || null,
        payslip_type: m.payslipType || null,
        payslip_size: m.payslipSize || null,
        payslip_date: m.payslipDate || null,
        payslip_data_url: m.payslipDataUrl || null,
      }))
      await supabase.from('members').upsert(rows, { onConflict: 'id' })
    }
    if(key === 'nut_loans' || key === 'nut_etiosa_loans'){
      const rows = data.map(l => ({
        id: l.id,
        member_id: l.memberId,
        principal: l.principal,
        duration: l.duration,
        purpose: l.purpose,
        guarantor_ids: l.guarantorIds || [],
        guarantor_approvals: l.guarantorApprovals || [],
        status: l.status,
        interest_rate: l.interestRate,
        monthly_repayment: l.monthlyRepayment,
        total_repayment: l.totalRepayment,
        outstanding: l.outstanding,
        created_at: l.createdAt,
        payslip_name: l.payslipName,
        payslip_type: l.payslipType,
        payslip_size: l.payslipSize,
        payslip_data_url: l.payslipDataUrl,
        net_pay: l.netPay
      }))
      await supabase.from('loans').upsert(rows, { onConflict: 'id' })
    }
    if(key === 'nut_savings' || key === 'nut_etiosa_savings'){
      const rows = data.map(s => ({
        id: s.id,
        member_id: s.memberId,
        month: s.month,
        value: s.value,
        savings_portion: s.savingsPortion || 0,
        loan_portion: s.loanPortion || 0,
        source: s.source
      }))
      await supabase.from('savings').upsert(rows, { onConflict: 'id' })
    }
    if(key === 'nut_commodities'){
      const rows = data.map(c => ({
        id: c.id,
        name: c.name,
        price: c.price,
        stock: c.stock,
        duration: c.duration,
        category: c.category,
        description: c.description
      }))
      await supabase.from('commodities').upsert(rows, { onConflict: 'id' })
    }
    if(key === 'nut_commodity_orders'){
      const rows = data.map(o => ({
        id: o.id,
        member_id: o.memberId,
        commodity_id: o.commodityId,
        quantity: o.quantity,
        monthly_amount: o.monthlyAmount,
        total_amount: o.totalAmount,
        duration: o.duration,
        outstanding: o.outstanding,
        status: o.status,
        created_at: o.createdAt,
        start_month: o.startMonth || null,
        paid_months: o.paidMonths || 0,
        order_date: o.orderDate || null
      }))
      await supabase.from('commodity_orders').upsert(rows, { onConflict: 'id' })
    }
  }catch(e){ console.log('sync skip', key, e.message) }
}

// Monkey-patch localStorage.setItem to auto-sync
const originalSetItem = localStorage.setItem.bind(localStorage)
localStorage.setItem = function(key, value){
  originalSetItem(key, value)
  if(key.startsWith('nut_')){
    // debounce
    clearTimeout(window['_sync_'+key])
    window['_sync_'+key] = setTimeout(()=> syncToSupabase(key, value), 800)
  }
}

// Intercept file inputs for payslips globally
document.addEventListener('change', async (e)=>{
  const input = e.target
  if(input.type === 'file' && input.files && input.files[0]){
    const file = input.files[0]
    const name = (input.name || input.id || '').toLowerCase()
    // Only auto-upload if it looks like a payslip input
    if(name.includes('payslip') || file.name.toLowerCase().includes('payslip') || document.body.innerHTML.includes('payslip')){
      // We upload but don't block original app - it will still create base64.
      // We store the public URL in a temporary global for later replacement
      const res = await window.uploadPayslipToSupabase(file)
      if(res){
        window.__lastPayslipUpload = res
        // Try to find the dataUrl in the app's pending state and replace it after a tick
        // The app stores base64 in localStorage - we will patch it
        setTimeout(()=>{
          // Replace any base64 that is too long in localStorage with the public URL
          ['nut_members','nut_loans','nut_etiosa_members','nut_etiosa_loans'].forEach(k=>{
            try{
              let raw = localStorage.getItem(k)
              if(!raw) return
              let arr = JSON.parse(raw)
              let changed = false
              arr.forEach(item=>{
                if(item.payslipDataUrl && item.payslipDataUrl.startsWith('data:')){
                  // If this item was just updated (same file name)
                  if(item.payslipName === file.name || (window.__lastPayslipUpload && item.payslipName === window.__lastPayslipUpload.fileName)){
                    item.payslipDataUrl = window.__lastPayslipUpload.publicUrl
                    changed = true
                  }
                }
              })
              if(changed){
                localStorage.setItem(k, JSON.stringify(arr))
              }
            }catch{}
          })
        }, 1200)
      }
    }
  }
}, true)

// --- OFFLINE QUEUE ---
const OFFLINE_QUEUE_KEY = 'nut_offline_queue_v2'
function getQueue(){ try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY)||'[]')}catch{return []} }
function setQueue(q){ localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)) }
function enqueue(op){ const q=getQueue(); q.push({...op, ts:Date.now()}); setQueue(q); }
function isOnline(){ return navigator.onLine }

async function processQueue(){
  if(!navigator.onLine) return
  const q=getQueue()
  if(q.length===0) return
  for(let i=0;i<q.length;i++){
    const op=q[i]
    try{
      if(op.table){
        const {error} = await supabase.from(op.table).upsert(op.rows, {onConflict:'id'})
        if(error) throw error
      }
    }catch(e){ console.error('queue retry failed', e); return }
  }
  setQueue([])
  console.log('Offline queue synced')
}

window.addEventListener('online', ()=>{ processQueue(); loadFromSupabase() })

// --- UPLOAD HELPER ---
window.uploadPayslipToSupabase = async function(file){
  if(!file) return null
  try{
    const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_')
    const { error: uploadError } = await supabase.storage.from(BUCKET).upload(fileName, file, { upsert: true })
    if(uploadError) throw uploadError
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(fileName)
    console.log('Payslip uploaded:', data.publicUrl)
    return { publicUrl: data.publicUrl, fileName: file.name, fileType: file.type, fileSize: file.size }
  } catch(e){
    console.error('Payslip upload failed', e)
    return null
  }
}

// --- SYNC HELPERS ---
async function syncToSupabase(key, value){
  try{
    const data = JSON.parse(value)
    if(!Array.isArray(data) || data.length===0) return
    let table=null, rows=[]
    if(key === 'nut_members' || key === 'nut_etiosa_members'){
      table='members'
      rows=data.map(m=>({
        id: m.id, employer_number: m.employerNumber, name: m.name, school: m.school||null, phone: m.phone||null,
        email: m.email||null, monthly_savings: m.monthlySavings||0, total_savings: m.totalSavings||0, pin: m.pin||'1234',
        is_first_login: m.is_first_login??true, status: m.status||'active', grade: m.grade||null, join_date: m.joinDate||new Date().toISOString(),
        payslip_name: m.payslipName||null, payslip_type: m.payslipType||null, payslip_size: m.payslipSize||null,
        payslip_date: m.payslipDate||null, payslip_data_url: m.payslipDataUrl||null
      }))
    }
    if(key === 'nut_loans' || key === 'nut_etiosa_loans'){ table='loans'; rows=data.map(l=>({
        id:l.id, member_id:l.memberId, principal:l.principal, duration:l.duration, purpose:l.purpose,
        guarantor_ids:l.guarantorIds||[], guarantor_approvals:l.guarantorApprovals||[], status:l.status,
        interest_rate:l.interestRate, monthly_repayment:l.monthlyRepayment, total_repayment:l.totalRepayment,
        outstanding:l.outstanding, created_at:l.createdAt, payslip_name:l.payslipName, payslip_type:l.payslipType,
        payslip_size:l.payslipSize, payslip_data_url:l.payslipDataUrl, net_pay:l.netPay
      })) }
    if(key === 'nut_savings' || key === 'nut_etiosa_savings'){ table='savings'; rows=data.map(s=>({
        id:s.id, member_id:s.memberId, month:s.month, value:s.value, savings_portion:s.savingsPortion||0, loan_portion:s.loanPortion||0, source:s.source
      })) }
    if(key === 'nut_commodities'){ table='commodities'; rows=data.map(c=>({id:c.id, name:c.name, price:c.price, stock:c.stock, duration:c.duration, category:c.category, description:c.description})) }
    if(key === 'nut_commodity_orders'){ table='commodity_orders'; rows=data.map(o=>({
        id:o.id, member_id:o.memberId, commodity_id:o.commodityId, quantity:o.quantity, monthly_amount:o.monthlyAmount,
        total_amount:o.totalAmount, duration:o.duration, outstanding:o.outstanding, status:o.status, created_at:o.createdAt,
        start_month:o.startMonth||null, paid_months:o.paidMonths||0, order_date:o.orderDate||null
      })) }
    if(!table) return
    if(navigator.onLine){
      const {error}=await supabase.from(table).upsert(rows, {onConflict:'id'})
      if(error) throw error
    } else {
      enqueue({table, rows})
    }
  }catch(e){ console.log('sync skip', key, e.message) }
}

// Monkey-patch localStorage.setItem to auto-sync with offline support
const originalSetItem = localStorage.setItem.bind(localStorage)
localStorage.setItem = function(key, value){
  originalSetItem(key, value)

    clearTimeout(window['_sync_'+key])
    window['_sync_'+key] = setTimeout(()=> syncToSupabase(key, value), 800)
  }
}

      if(local.length===0 || loans.length>=local.length){ originalSetItem('nut_loans', JSON.stringify(mapped)); originalSetItem('nut_etiosa_loans', JSON.stringify(mapped)); }
    }
    if(savings && savings.length>0){
      const mapped=savings.map(s=>({id:s.id, memberId:s.member_id, month:s.month, value:s.value, savingsPortion:s.savings_portion, loanPortion:s.loan_portion, source:s.source}))

      if(local.length===0 || savings.length>=local.length){ originalSetItem('nut_savings', JSON.stringify(mapped)); originalSetItem('nut_etiosa_savings', JSON.stringify(mapped)); }
    }
    if(commodities && commodities.length>0){ originalSetItem('nut_commodities', JSON.stringify(commodities.map(c=>({id:c.id, name:c.name, price:c.price, stock:c.stock, duration:c.duration, category:c.category, description:c.description})))) }

    console.log('Supabase loaded, refreshing if needed...')
    // If data was loaded for first time, reload page to show it in UI
    if(!window._supabaseLoaded){
      window._supabaseLoaded=true
      const localMembers=JSON.parse(localStorage.getItem('nut_members')||'[]')
      if(localMembers.length>0 && !window._reloaded){
        // trigger a soft reload of React state by dispatching storage event
        window.dispatchEvent(new Event('storage'))
      }
    }
  }catch(e){ console.error('loadFromSupabase fail', e) }
}

document.addEventListener('change', async (e)=>{
  const input=e.target

            }catch{}
          })
        }, 1200)
      }
    }
  }
